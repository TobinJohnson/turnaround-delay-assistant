<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turnaround Delay Assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css" />
    <style>
      #loading { font-family: system-ui, sans-serif; text-align: center; margin-top: 30vh; color: #555; }
    </style>
  </head>
  <body>
    <div id="root">
      <p id="loading">Loading the Turnaround Delay Assistant… (Python starts in your browser, about 10–20 seconds)</p>
    </div>
    <script type="module">
      // Runs the Streamlit app fully in the browser with stlite (Pyodide), so GitHub Pages can host it.
      // No server and no API key: the dashboard uses the rule-based recovery playbook.
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

      const sourceFiles = [
        "app.py", "agent.py", "tools.py", "detector.py", "data_generator.py", "turnaround.py", "build_sample.py",
        "data/flights.csv", "data/tasks.csv", "data/resources.csv", "data/delay_history.csv",
        "sample_data/schedule.csv", "sample_data/flights.csv", "sample_data/tasks.csv",
        "sample_data/resources.csv", "sample_data/delay_history.csv",
      ];
      const files = Object.fromEntries(sourceFiles.map((path) => [path, { url: "./" + path }]));

      mount(
        {
          requirements: ["pandas", "altair", "jinja2"],
          entrypoint: "app.py",
          files,
          streamlitConfig: { "client.toolbarMode": "viewer" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
